[package]
name = "JumpServerClient"
version = "1.4.4"
description = "JumpServer SSH 客户端工具"
authors = ["you"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "jump_server_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "native-tls-vendored"] }
chrono = "0.4"
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
url = "2"
dirs = "5"
async-ssh2-russh = "0.3"
anyhow = "1"
thiserror = "2"
log = "0.4"

[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1
panic = "abort"
