name: Build Releases

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-macos:
    name: macOS (${{ matrix.target }})
    runs-on: macos-latest
    env:
      MACOSX_DEPLOYMENT_TARGET: '10.13'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            artifact: macOS-DMG-aarch64
          - target: x86_64-apple-darwin
            artifact: macOS-DMG-x64
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies
        run: pnpm install

      - name: Build macOS DMG
        run: pnpm tauri build --target ${{ matrix.target }} --bundles dmg

      # 产物重命名为用户友好的平台名：aarch64 → macOS_apple-silicon，x64 → macOS_intel
      - name: Rename DMG
        run: |
          cd "src-tauri/target/${{ matrix.target }}/release/bundle/dmg"
          for f in *.dmg; do
            case "$f" in
              *aarch64*) mv "$f" "${f/aarch64/macOS_apple-silicon}" ;;
              *x64*) mv "$f" "${f/x64/macOS_intel}" ;;
            esac
          done

      - name: Upload macOS DMG
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install dependencies
        run: pnpm install

      - name: Build Windows Installer
        run: pnpm tauri build --bundles nsis

      # 产物重命名：x64-setup → Windows_x64-setup
      - name: Rename installer
        shell: bash
        run: |
          cd src-tauri/target/release/bundle/nsis
          for f in *.exe; do
            mv "$f" "${f/x64-setup/Windows_x64-setup}"
          done

      - name: Upload Windows Installer
        uses: actions/upload-artifact@v7
        with:
          name: Windows-Installer
          path: src-tauri/target/release/bundle/nsis/*.exe

  release:
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            macOS-DMG-aarch64/*.dmg
            macOS-DMG-x64/*.dmg
            Windows-Installer/*.exe
          draft: false
          prerelease: false
